{% macro mailing_address_fields(address=None, locked=false) %}
<fieldset class="form-grid"{% if locked %} disabled{% endif %}>
  <legend class="visually-hidden">Your mailing address</legend>
  <label class="form-label">Full Name <input class="form-control" name="name"{% if address %} value="{{ address.addressee }}"{% endif %} required autocomplete="name"></label>
  {% if not address %}
  <label class="form-label">Email <input class="form-control" name="email" type="email" required autocomplete="email"></label>
  {% endif %}
  <label class="form-label field-wide">Address Line 1 <input class="form-control" name="address_line1"{% if address %} value="{{ address.address_line1 }}"{% endif %} required autocomplete="address-line1"></label>
  <label class="form-label field-wide">Address Line 2 <input class="form-control" name="address_line2"{% if address %} value="{{ address.address_line2 or '' }}"{% endif %} autocomplete="address-line2" placeholder="Optional"></label>
  <label class="form-label">City <input class="form-control" name="city"{% if address %} value="{{ address.city }}"{% endif %} required autocomplete="address-level2"></label>
  <label class="form-label">State / Province <input class="form-control" name="region"{% if address %} value="{{ address.region or '' }}"{% endif %} autocomplete="address-level1" placeholder="If applicable"></label>
  <label class="form-label">Postal Code <input class="form-control" name="postal_code"{% if address %} value="{{ address.postal_code }}"{% endif %} required autocomplete="postal-code"></label>
  <label class="form-label">Country <input class="form-control" name="country"{% if address %} value="{{ address.country }}"{% endif %} required autocomplete="country-name" placeholder="I mail worldwide"></label>
</fieldset>
{% endmacro %}
